<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='44' width='14' height='14' rx='5' fill='%230f8a74' opacity='.45'/%3E%3Crect x='22' y='32' width='14' height='26' rx='5' fill='%230f8a74' opacity='.72'/%3E%3Crect x='40' y='20' width='14' height='38' rx='5' fill='%230f8a74'/%3E%3Ccircle cx='47' cy='9' r='6.5' fill='%23ffd166'/%3E%3C/svg%3E">
<title>Your library · Easy Start AI Members</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/members/members.css">
</head>
<body>
<header class="top"><div class="wrap">
  <a class="logo" href="/members/"><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="4" y="44" width="14" height="14" rx="5" fill="var(--accent)" opacity=".45"/><rect x="22" y="32" width="14" height="26" rx="5" fill="var(--accent)" opacity=".72"/><rect x="40" y="20" width="14" height="38" rx="5" fill="var(--accent)"/><circle cx="47" cy="9" r="6.5" fill="var(--sun)"/></svg><span>Easy Start <span class="ai">AI</span> <small>Members</small></span></a>
  <nav class="mnav" aria-label="Members"><a href="/members/">Library</a><a href="/">Main site</a><a href="/cdn-cgi/access/logout">Log out</a></nav>
</div></header>
<main><div class="wrap stack" style="gap:24px">
<div class="stack">
  <h1 id="greet">Welcome to your library</h1>
  <p class="lead" id="plan">Checking your plan…</p>
</div>
<div class="grid" id="cards" aria-live="polite"></div>
<div class="note" id="upsell" hidden></div>
<p class="small">New tips and templates are added regularly. Questions? Email support@easystartai.co.uk.</p>
</div></main>
<footer><div class="wrap"><span>© 2026 Easy Start AI</span><span>Questions? support@easystartai.co.uk</span></div></footer>
<script>
(async()=>{
  const LABEL={free:'Free',starter:'Starter',plus:'Plus',parents:'Parent guide'};
  const ORDER=['free','starter','parents','plus'];
  // Which folders can this visitor open? Cloudflare Access blocks the ones their plan doesn't include.
  async function can(r){try{const x=await fetch('/members/'+r+'/ok.json',{credentials:'same-origin',redirect:'manual',cache:'no-store'});if(!x.ok)return false;const j=await x.json();return j.ok===true;}catch(e){return false;}}
  const [st,pl,pa]=await Promise.all([can('starter'),can('plus'),can('parents')]);
  const mine=new Set(['free']);if(st)mine.add('starter');if(pl){mine.add('plus');mine.add('starter');mine.add('parents');}if(pa)mine.add('parents');
  const top=pl?'plus':(st&&pa?'starter and parents':(st?'starter':(pa?'parents':'free')));
  const names={plus:'Plus','starter and parents':'Starter and Parent guide',starter:'Starter',parents:'Parent guide',free:'Free'};
  document.getElementById('plan').textContent='Your plan: '+names[top]+'. Everything you can open is shown first.';
  let data;try{data=await (await fetch('/members/library.json',{cache:'no-store'})).json();}catch(e){document.getElementById('cards').textContent='Sorry, the library didn\'t load. Please refresh the page.';return;}
  const items=data.items.slice().sort((a,b)=>(b.who.some(w=>mine.has(w))-a.who.some(w=>mine.has(w)))||b.added.localeCompare(a.added));
  const cards=document.getElementById('cards');
  items.forEach(it=>{
    const ok=it.who.some(w=>mine.has(w));
    const need=ORDER.find(r=>it.who.includes(r))||'plus';
    const el=document.createElement(ok?'a':'div');el.className='card'+(ok?'':' locked');if(ok)el.href=it.url;
    const meta=document.createElement('div');meta.className='meta';
    const pill=document.createElement('span');pill.className='pill r-'+need;pill.textContent=LABEL[need];
    const k=document.createElement('span');k.textContent=it.kind;meta.append(pill,k);
    const h=document.createElement('h3');h.textContent=it.title;
    const p=document.createElement('p');p.className='small';p.textContent=it.blurb||'';
    const act=document.createElement('span');act.className='act';act.textContent=ok?'Open →':'Included with '+LABEL[need];
    el.append(meta,h,p,act);cards.appendChild(el);
  });
  if(!pl){const u=document.getElementById('upsell');u.hidden=false;u.innerHTML='Want everything? <strong>Plus</strong> opens every tip, template and guide, with replies within one working day. <a href="/#personal-plans">See plans</a>';}
})();
</script>
</body>
</html>
